<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prem Swarm AI - Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: #1e1e1f;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2e2e2f;
            padding: 12px;
        }

        .new-chat-btn {
            background-color: #2b2b2c;
            color: #ffffff;
            border: 1px solid #3c3c3d;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .new-chat-btn:hover {
            background-color: #383839;
        }

        .chat-history {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: #c4c7c5;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .history-item:hover {
            background-color: #2b2b2c;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #2e2e2f;
            font-size: 1.1rem;
            font-weight: 600;
            color: #e3e3e3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.8rem;
            background: #1c3829;
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #22543d;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 15%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-row {
            display: flex;
            gap: 16px;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #6366f1;
            color: white;
        }

        .assistant .avatar {
            background-color: #10a37f;
            color: white;
        }

        .message-bubble {
            background-color: #1e1e1f;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            border: 1px solid #2e2e2f;
        }

        .user .message-bubble {
            background-color: #2b2b2c;
            border-color: #3c3c3d;
        }

        .input-area {
            padding: 20px 15%;
            background-color: #131314;
        }

        .input-box-container {
            display: flex;
            background-color: #1e1e1f;
            border: 1px solid #3c3c3d;
            border-radius: 24px;
            padding: 8px 16px;
            align-items: center;
        }

        .input-box-container:focus-within {
            border-color: #6366f1;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 0.95rem;
            resize: none;
            height: 24px;
            max-height: 120px;
            padding: 4px 0;
        }

        .send-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-container, .input-area { padding: 16px; }
            .message-row { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn">+ New Session</button>
        <div class="chat-history">
            <div class="history-item">⚡ Swarm Matrix Iterations</div>
            <div class="history-item">🛠️ Code Architect Logs</div>
            <div class="history-item">📊 Database Analytics</div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span>Prem Swarm AI Engine</span>
            <span class="status-badge">● Online</span>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message-row assistant">
                <div class="avatar">AI</div>
                <div class="message-bubble">
                    Swarm AI Interface ready. Direct integration protocol active.
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box-container">
                <textarea id="userInput" placeholder="Ask Swarm AI..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">➔</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(role, text) {
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = role === 'user' ? 'YOU' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerText = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            try {
                const response = await fetch('https://ce98fb933a6217a2-103-218-237-79.serveousercontent.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage('assistant', data.response || 'Execution completed.');
            } catch (err) {
                appendMessage('assistant', '⚠️ Connection error. Ensure Flask server is running.');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
